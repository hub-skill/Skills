# Base comum a Python e .NET (as duas imagens escutam na 8080 e têm /health/live e /health/ready).
# Configuração e segredos ficam nos overlays (os nomes das variáveis mudam por linguagem).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: projeto-api
      app.kubernetes.io/managed-by: kustomize
resources:
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml

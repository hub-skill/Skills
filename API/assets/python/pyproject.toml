[project]
name = "projeto-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "anyio>=4.1",  # to_thread.run_sync(..., abandon_on_cancel=True)
  "uvicorn>=0.36",
  "gunicorn>=22",
  "uvicorn-worker>=0.2",
  "pydantic-settings>=2.4",
  "slowapi>=0.1.9",
  "prometheus-fastapi-instrumentator>=7",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "hypothesis>=6",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

# Aplicação, não biblioteca: o uv não tenta empacotar o projeto.
[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.flake8-bugbear]
# Depends/Security em valores padrão é o padrão do FastAPI, não um bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]

[tool.ruff.lint.per-file-ignores]
# Testes usam assert e chaves/senhas de teste.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["slowapi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=85"
